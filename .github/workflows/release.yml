# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup .NET 9
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 9.0.x

      - name: Require tag to match the current ABI package version
        shell: pwsh
        run: |
          $versionOutput = @(
            dotnet msbuild Jellyfin.Plugin.AudioTagger.csproj `
              -nologo `
              -getProperty:Version `
              -property:TargetFramework=net9.0
          )
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to read the net9.0 plugin version.'
          }
          $version = (
            $versionOutput |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Select-Object -Last 1
          )
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'The net9.0 plugin version is empty.'
          }
          $version = $version.Trim()

          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' must be '$expectedTag' for the net9.0 package."
          }

  changelog:
    name: Generate changelog
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: .github/cliff.toml
          args: -vv --current
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

  create-draft-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    needs: [validate-release, changelog]
    permissions:
      contents: write
    steps:
      - name: Create or refresh draft release
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --title "Release ${GITHUB_REF_NAME}" \
              --notes "${RELEASE_BODY}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --title "Release ${GITHUB_REF_NAME}" \
              --notes "${RELEASE_BODY}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ needs.changelog.outputs.release_body }}

  prepare-artifacts:
    name: Build and package ${{ matrix.tfm }}
    needs: [create-draft-release, changelog]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tfm: net8.0
            sdk: 8.0.x
          - tfm: net9.0
            sdk: 9.0.x
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup .NET ${{ matrix.sdk }}
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

      - name: Restore ${{ matrix.tfm }}
        shell: pwsh
        run: |
          dotnet restore Jellyfin.Plugin.AudioTagger.sln `
            -property:TargetFrameworks=${{ matrix.tfm }}
          if ($LASTEXITCODE -ne 0) {
            throw 'Solution restore failed.'
          }

          dotnet restore Jellyfin.Plugin.AudioTagger.csproj `
            --force-evaluate `
            -property:TargetFrameworks=${{ matrix.tfm }} `
            -property:RestorePackagesWithLockFile=true `
            -property:NuGetLockFilePath=obj/packages.${{ matrix.tfm }}.lock.json
          if ($LASTEXITCODE -ne 0) {
            throw 'Plugin lock-file restore failed.'
          }

      - name: Build ${{ matrix.tfm }}
        shell: pwsh
        run: >
          dotnet build Jellyfin.Plugin.AudioTagger.sln
          --configuration Release
          --no-restore
          -property:TargetFrameworks=${{ matrix.tfm }}

      - name: Test ${{ matrix.tfm }}
        shell: pwsh
        run: >
          dotnet test Jellyfin.Plugin.AudioTagger.sln
          --configuration Release
          --no-build
          --no-restore
          -property:TargetFrameworks=${{ matrix.tfm }}

      - name: Package and validate ${{ matrix.tfm }}
        shell: pwsh
        env:
          RELEASE_CHANGELOG: ${{ needs.changelog.outputs.release_body }}
        run: |
          ./scripts/New-PluginPackage.ps1 `
            -ProjectPath Jellyfin.Plugin.AudioTagger.csproj `
            -TargetFramework '${{ matrix.tfm }}' `
            -DllPath 'bin/Release/${{ matrix.tfm }}/Jellyfin.Plugin.AudioTagger.dll' `
            -OutputDirectory 'release-${{ matrix.tfm }}' `
            -Repository '${{ github.repository }}' `
            -ReleaseTag '${{ github.ref_name }}' `
            -Changelog $env:RELEASE_CHANGELOG `
            -NuGetLockPath 'obj/packages.${{ matrix.tfm }}.lock.json' `
            -GenerateSbom

      - name: Upload ${{ matrix.tfm }} artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-${{ matrix.tfm }}-${{ github.ref_name }}
          path: release-${{ matrix.tfm }}/*
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign packages and SBOMs
    needs: prepare-artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      COSIGN_YES: 'true'
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download net8.0 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts-net8.0-${{ github.ref_name }}
          path: release

      - name: Download net9.0 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts-net9.0-${{ github.ref_name }}
          path: release

      - name: Sign every package and SBOM
        shell: pwsh
        run: |
          $null = New-Item -ItemType Directory -Path signatures
          $files = @(
            Get-ChildItem -LiteralPath release -File |
              Where-Object { $_.Name.EndsWith('.zip') -or $_.Name.EndsWith('.sbom.cdx.json') }
          )
          if (@($files | Where-Object Name -Like '*.zip').Count -ne 2) {
            throw 'Expected exactly two plugin ZIPs to sign.'
          }
          if (@($files | Where-Object Name -Like '*.sbom.cdx.json').Count -ne 2) {
            throw 'Expected exactly two SBOMs to sign.'
          }

          foreach ($file in $files) {
            cosign sign-blob `
              --bundle "signatures/$($file.Name).bundle" `
              $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Cosign failed to sign '$($file.Name)'."
            }
          }

      - name: Upload signature bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signature-bundles-${{ github.ref_name }}
          path: signatures/*
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify release artifacts
    needs: [prepare-artifacts, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout validation scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download net8.0 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts-net8.0-${{ github.ref_name }}
          path: release

      - name: Download net9.0 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts-net9.0-${{ github.ref_name }}
          path: release

      - name: Download signature bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signature-bundles-${{ github.ref_name }}
          path: signatures

      - name: Validate package contents, checksums, catalog entries, and SBOMs
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath release -Filter '*.zip' -File)
          if ($packages.Count -ne 2) {
            throw 'Expected exactly two plugin ZIPs to validate.'
          }

          foreach ($package in $packages) {
            $stem = [System.IO.Path]::GetFileNameWithoutExtension($package.Name)
            ./scripts/New-PluginPackage.ps1 `
              -ValidatePackage $package.FullName `
              -SbomPath "release/$stem.sbom.cdx.json"
          }

      - name: Verify every package and SBOM signature
        shell: pwsh
        run: |
          $identity = 'https://github.com/${{ github.workflow_ref }}'
          $files = @(
            Get-ChildItem -LiteralPath release -File |
              Where-Object { $_.Name.EndsWith('.zip') -or $_.Name.EndsWith('.sbom.cdx.json') }
          )
          if ($files.Count -ne 4) {
            throw 'Expected two packages and two SBOMs to verify.'
          }

          foreach ($file in $files) {
            $bundle = "signatures/$($file.Name).bundle"
            if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) {
              throw "Signature bundle is missing for '$($file.Name)'."
            }

            cosign verify-blob `
              --bundle $bundle `
              --certificate-identity $identity `
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' `
              $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Cosign failed to verify '$($file.Name)'."
            }
          }

  upload-draft-assets:
    name: Upload verified assets to draft
    needs: [create-draft-release, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download net8.0 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts-net8.0-${{ github.ref_name }}
          path: release

      - name: Download net9.0 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts-net9.0-${{ github.ref_name }}
          path: release

      - name: Download signature bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signature-bundles-${{ github.ref_name }}
          path: signatures

      - name: Upload all release outputs
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release/* \
            signatures/* \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-package-manifest:
    name: Update package manifest on main
    needs: upload-draft-assets
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Download net8.0 catalog entry
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts-net8.0-${{ github.ref_name }}
          path: generated-release

      - name: Download net9.0 catalog entry
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts-net9.0-${{ github.ref_name }}
          path: generated-release

      - name: Merge generated catalog entries
        shell: pwsh
        run: |
          $entries = @(
            Get-ChildItem -LiteralPath generated-release -Filter '*.manifest-entry.json' -File
          )
          if ($entries.Count -ne 2) {
            throw 'Expected exactly two generated catalog entries.'
          }

          ./scripts/Update-PluginManifest.ps1 `
            -ManifestPath manifest.json `
            -EntryPath $entries.FullName

      - name: Commit and push catalog update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- manifest.json
          if git diff --cached --quiet; then
            echo "Package manifest is already current."
            exit 0
          fi

          git commit -m "Update plugin manifest for ${GITHUB_REF_NAME}"
          git pull --rebase origin main
          git push origin HEAD:main

  publish-release:
    name: Publish release
    needs: update-package-manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish verified draft
        shell: bash
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  discord:
    name: Send Discord notification
    needs: [publish-release, update-package-manifest]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Determine status
        id: status
        shell: bash
        run: |
          if [[ "${{ needs.publish-release.result }}" == "success" && "${{ needs.update-package-manifest.result }}" == "success" ]]; then
            echo "status=Success" >> "${GITHUB_OUTPUT}"
            echo "colour=3066993" >> "${GITHUB_OUTPUT}"
          elif [[ "${{ needs.publish-release.result }}" == "cancelled" || "${{ needs.update-package-manifest.result }}" == "cancelled" ]]; then
            echo "status=Cancelled" >> "${GITHUB_OUTPUT}"
            echo "colour=10181046" >> "${GITHUB_OUTPUT}"
          else
            echo "status=Failure" >> "${GITHUB_OUTPUT}"
            echo "colour=15158332" >> "${GITHUB_OUTPUT}"
          fi

      - name: Send notification
        continue-on-error: true
        shell: bash
        run: |
          if [[ -z "${DISCORD_WEBHOOK}" ]]; then
            echo "DISCORD_WEBHOOK is not configured; skipping notification."
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg title "${{ steps.status.outputs.status }}: ${{ github.workflow }}" \
            --arg repository "${{ github.repository }}" \
            --arg repository_url "${{ github.server_url }}/${{ github.repository }}" \
            --arg ref "${{ github.ref }}" \
            --arg event "${{ github.event_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg workflow_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson colour "${{ steps.status.outputs.colour }}" \
            '{
              embeds: [{
                title: $title,
                color: $colour,
                fields: [
                  {name: "Repository", value: ("[" + $repository + "](" + $repository_url + ")"), inline: true},
                  {name: "Ref", value: $ref, inline: true},
                  {name: "Event", value: $event, inline: true},
                  {name: "Triggered by", value: $actor, inline: true},
                  {name: "Workflow", value: ("[Workflow run](" + $workflow_url + ")"), inline: true}
                ]
              }]
            }')

          curl --fail-with-body --silent --show-error \
            --header "Content-Type: application/json" \
            --request POST \
            --data "${PAYLOAD}" \
            "${DISCORD_WEBHOOK}" ||
            echo "Discord notification failed; the release result is unaffected."
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

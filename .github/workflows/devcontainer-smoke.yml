# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Devcontainer Smoke Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: devcontainer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke Test Dev Container
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          push: never
          runCmd: echo "container up"

      - name: Verify inside devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          push: never
          runCmd: |
            bash -lc '
              set -euo pipefail
              id -un | grep -qx vscode
      
              # ensure mounted volumes are writable
              sudo mkdir -p /home/vscode/.dotnet/tools /home/vscode/.nuget
              sudo chown -R vscode:vscode /home/vscode/.dotnet /home/vscode/.nuget
      
              command -v dotnet >/dev/null
              dotnet --info >/dev/null
              # The devcontainer installs .NET 9; the compatibility workflow covers both ABIs.
              dotnet restore Jellyfin.Plugin.AudioTagger.sln -p:TargetFrameworks=net9.0
              dotnet build Jellyfin.Plugin.AudioTagger.sln --configuration Release --no-restore -p:TargetFrameworks=net9.0
              dotnet test Jellyfin.Plugin.AudioTagger.sln --configuration Release --no-build --no-restore -p:TargetFrameworks=net9.0
      
              if [ -S /var/run/docker.sock ]; then
                docker version >/dev/null 2>&1 || true
                docker ps >/dev/null 2>&1 || true
                echo "Docker socket present"
              else
                echo "No Docker socket, skipping daemon checks"
              fi
      
              echo "OK: devcontainer is healthy"
            '
